<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Auri">
<title>Auri · Jurnal XAUUSD</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050705'/%3E%3Cpath d='M18 41l9-9 6 5 13-15' fill='none' stroke='%2339ff6a' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem('auri-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
:root{--sans:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--disp:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1)}
[data-theme=light]{--bg:#f7f8f5;--surface:#fff;--surface2:#f0f2ed;--text:#0d1a11;--muted:#5f6d63;--line:#e1e6dd;--accent:#0b5a2b;--accent-ink:#fff;--accent-soft:rgba(11,90,43,.10);--loss:#b3261e;--loss-soft:rgba(179,38,30,.09);color-scheme:light}
[data-theme=dark]{--bg:#050705;--surface:#0c100c;--surface2:#141a14;--text:#e8f1e9;--muted:#808f83;--line:#1c241d;--accent:#39ff6a;--accent-ink:#04120a;--accent-soft:rgba(57,255,106,.11);--loss:#ff5d5d;--loss-soft:rgba(255,93,93,.12);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:400 15.5px/1.5 var(--sans);-webkit-text-size-adjust:100%;transition:background .3s,color .3s}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.015em;line-height:1.2;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--accent)}.dn{color:var(--loss)}
.muted{color:var(--muted)}

/* ── logo & splash ── */
.logo{display:block;color:var(--accent);width:40px;height:40px;flex:none}
.logo .lg-ring,.logo .lg-line{stroke-dasharray:1 1}
.logo:not(.anim) .lg-ring,.logo:not(.anim) .lg-line{stroke-dashoffset:0}
.logo.anim .lg-ring,.logo.anim .lg-line{stroke-dashoffset:1}
.logo.anim .lg-ring{animation:draw .95s .1s cubic-bezier(.6,.1,.2,1) forwards}
.logo.anim .lg-line{animation:draw .6s .8s ease-out forwards}
.logo.anim .lg-dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .45s 1.3s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s,transform .45s}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .logo{width:112px;height:112px}
.sp-word{font:700 34px var(--disp);letter-spacing:-.015em;opacity:0;transform:translateY(8px);animation:rise .6s 1.15s var(--ease) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wordmark{font:700 24px var(--disp);letter-spacing:-.015em}

/* ── auth ── */
#auth{min-height:100dvh;position:relative;overflow:hidden}
#auth::before{content:"";position:absolute;width:640px;height:640px;border-radius:50%;border:1px solid var(--line);right:-300px;bottom:-260px;pointer-events:none}
#auth::after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;border:1px solid var(--line);left:-210px;top:-150px;pointer-events:none}
.auth-wrap{position:relative;z-index:1;min-height:100dvh;max-width:420px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;gap:22px;animation:rise .5s var(--ease) both}
.auth-brand{display:flex;align-items:center;gap:12px}
.theme-btn{position:absolute;right:20px;top:calc(18px + env(safe-area-inset-top))}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px}
.auth-card h1{font-size:26px;margin-bottom:4px}
.auth-card>p{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:14px;padding:4px;margin-bottom:20px}
.tabs button{min-height:40px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--muted);transition:background .2s,color .2s}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fld{display:block;margin-bottom:14px;min-width:0}
.fld>span{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;min-height:48px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
textarea{padding:12px 14px;resize:none;min-height:72px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=date]{min-width:0;text-align:left}
.pw{position:relative}
.pw input{padding-right:48px}
.eye{position:absolute;right:4px;top:0;width:44px;height:48px;display:grid;place-items:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15.5px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--loss);border:1px solid var(--line)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.loading::after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lnk{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.lnk-row{display:flex;justify-content:space-between;align-items:center;margin:-2px 0 16px}
.msg{font-size:13.5px;border-radius:12px;padding:10px 12px;margin-bottom:14px;line-height:1.4}
.msg.err{background:var(--loss-soft);color:var(--loss)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.err-t{color:var(--loss);font-size:13.5px;min-height:20px;margin-bottom:8px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text);transition:background .2s}
.icon-btn:hover{background:var(--surface2)}

/* ── shell ── */
.shell{display:block}
.side{display:none}
.main{width:100%;max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.main>*{min-width:0}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottom .nv{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:6px 0;border-radius:12px;transition:color .2s}
.bottom .nv.on{color:var(--accent)}
.bottom .nv svg{transition:transform .25s var(--ease)}
.bottom .nv.on svg{transform:translateY(-1px) scale(1.08)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;z-index:21;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .15s,opacity .2s}
.fab:active{transform:scale(.94)}
body:not([data-page=home]):not([data-page=trades]) .fab{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.ph h1{font-size:26px}
.ph p{color:var(--muted);font-size:14px;margin-top:2px}
.ph-r{display:flex;align-items:center;gap:4px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 16px var(--disp);flex:none;text-transform:uppercase}
.av.lg{width:76px;height:76px;font-size:28px}
.av.sm{width:36px;height:36px;font-size:14px}

@media(min-width:900px){
 .shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}
 .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh;padding:26px 18px;border-right:1px solid var(--line)}
 .side .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding-left:6px}
 .side .nv{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;font-weight:500;color:var(--muted);text-align:left;transition:background .2s,color .2s}
 .side .nv:hover{background:var(--surface2)}
 .side .nv.on{background:var(--accent-soft);color:var(--accent)}
 .side .btn{margin-top:12px}
 .side-f{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line);min-width:0}
 .side-f b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
 .main{max-width:1180px;padding:34px 40px 48px}
 .bottom,.fab{display:none!important}
}

/* ── cards ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0;transition:background .3s,border-color .3s}
.enter .card,.enter .ed-card{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.stack{display:grid;gap:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:17px}
.eyebrow{font-size:13px;color:var(--muted)}
.big{font:700 clamp(32px,8vw,46px)/1.1 var(--disp);letter-spacing:-.015em;margin:6px 0 16px;font-variant-numeric:tabular-nums}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.trio span{display:block;font-size:12.5px;color:var(--muted)}
.trio b{display:block;font:500 14px var(--mono);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal-note{margin-top:12px;font-size:13px;color:var(--muted)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg.wide{display:grid;width:100%}
.seg button{min-height:38px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg[data-seg=res] button.on[data-v=loss]{background:var(--loss);color:#fff}
.seg.sm button{min-height:32px;padding:0 12px;font-size:13px}
.chips{display:flex;gap:4px}
.chips button{min-height:30px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.chips button.on{background:var(--surface2);color:var(--text)}
.chart-box{position:relative;margin:4px -6px 0;touch-action:pan-y}
.chart-svg{display:block;max-width:100%;overflow:visible}
.chart-svg .ln{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chart-svg.up{--c:var(--accent)}.chart-svg.dn{--c:var(--loss)}
.chart-svg .s1{stop-color:var(--c);stop-opacity:.24}.chart-svg .s2{stop-color:var(--c);stop-opacity:0}
.chart-svg .gl{stroke:var(--line);stroke-width:1}
.chart-svg .zl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.chart-svg text{fill:var(--muted);font:11px var(--mono)}
.chart-svg .endc{fill:var(--c)}
.chart-svg .ping{fill:var(--c);opacity:.3;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
.chart-svg .gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart-svg .gc{fill:var(--surface);stroke:var(--c);stroke-width:2}
.chart-svg.draw .ln{stroke-dasharray:1 1;animation:draw 1.1s var(--ease) both}
.chart-svg.draw .area{animation:fade .9s .35s both}
@keyframes fade{from{opacity:0}}
@keyframes ping{0%{transform:scale(1);opacity:.4}100%{transform:scale(3.2);opacity:0}}
.tip{position:absolute;top:0;background:var(--text);color:var(--bg);font:500 12px var(--mono);padding:5px 8px;border-radius:8px;pointer-events:none;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 8px;line-height:1.5}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0}
.plabel{font:600 16px var(--disp);text-align:center;flex:1}
.plabel small{display:block;font:400 12px var(--sans);color:var(--accent);margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface2);border-radius:16px;padding:14px;min-width:0}
.tile span{display:block;font-size:12.5px;color:var(--muted)}
.tile b{display:block;font:500 22px/1.2 var(--mono);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12px;color:var(--muted)}
.ring-t{display:flex;align-items:center;gap:12px}
.ring{width:56px;height:56px;flex:none;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:var(--line);stroke-width:5}
.ring .rv{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:var(--wr) 1;animation:ringIn .9s var(--ease) both}
@keyframes ringIn{from{stroke-dasharray:0 1}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:12px}
.kv div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv span{color:var(--muted)}.kv b{font:500 13px var(--mono)}
.target{margin-top:14px}
.target .bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.target .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.target p{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.2fr);gap:4px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.day,.wk{aspect-ratio:1/1.08;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;min-width:0;transition:transform .12s}
.day:active,.wk:active{transform:scale(.94)}
.day i{font-style:normal;font-size:13px;font-weight:500}
.day em,.wk em{font:500 9.5px var(--mono);font-style:normal;letter-spacing:-.03em}
.wk small{font:400 9px var(--mono);color:var(--muted)}
.day.win{background:var(--accent-soft)}.day.win em{color:var(--accent)}
.day.loss{background:var(--loss-soft)}.day.loss em{color:var(--loss)}
.day.be{background:var(--surface2)}
.day.out{opacity:.32}
.day.today i::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin:1px auto 0}
.day.insel:not(.pick){box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.pick{background:var(--accent);color:var(--accent-ink)}.day.pick em{color:inherit}.day.pick.today i::after{background:currentColor}
.wk{background:var(--surface2)}
.wk.win em{color:var(--accent)}.wk.loss em{color:var(--loss)}
.wk.insel{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-sum{font-size:13px;color:var(--muted);margin-bottom:12px}

/* lists */
.list{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line);text-align:left}
.list .row:first-child{border-top:0}
.row-m b{display:block;font:500 14.5px var(--mono)}
.row-m small{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-r{font:500 15px var(--mono);text-align:right}
.row-r small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.tag{font:600 11.5px var(--sans);padding:5px 8px;border-radius:8px;letter-spacing:.02em;min-width:52px;text-align:center}
.tag.buy,.tag.deposit{background:var(--accent-soft);color:var(--accent)}
.tag.sell,.tag.withdraw{background:var(--loss-soft);color:var(--loss)}
.grp{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;font-size:13px;color:var(--muted)}
.grp b{font:500 13px var(--mono)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

/* settings */
.prof{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.prof .cam{position:relative;cursor:pointer;display:inline-block;border-radius:50%;flex:none;transition:transform .15s}
.prof .cam:hover .av{filter:brightness(1.05);box-shadow:0 0 0 3px var(--accent-soft)}
.prof .cam:active{transform:scale(.96)}
.prof .cam .cam-badge,.prof .cam button{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.18);pointer-events:none;transition:transform .15s}
.prof .cam:hover .cam-badge,.prof .cam:hover button{transform:scale(1.1)}
.card h3{font-size:16px;margin-bottom:12px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.set-row span{font-size:14.5px}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .22s}
.sheet{position:relative;width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s var(--ease);overscroll-behavior:contain}
#modal.open .scrim{opacity:1}#modal.open .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 8px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-h h3{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rr{font:500 13px var(--mono);color:var(--muted);margin:-4px 0 14px;min-height:18px}
.rr.good{color:var(--accent)}.rr.warn{color:var(--loss)}
.form-act{display:grid;gap:10px;margin-top:6px}
.form-act.two{grid-template-columns:1fr 1fr}
@media(min-width:700px){
 #modal{align-items:center}
 .sheet{border-radius:24px;transform:translateY(16px) scale(.98);opacity:0;transition:transform .25s var(--ease),opacity .2s}

function stats(arr) {
  let w = 0, l = 0, gw = 0, gl = 0, pnl = 0, best = null, worst = null;
  for (const t of arr) {
    pnl += t.pnl;
    if (t.pnl > 0) { w++; gw += t.pnl; } else if (t.pnl < 0) { l++; gl -= t.pnl; }
    if (best === null || t.pnl > best) best = t.pnl;
    if (worst === null || t.pnl < worst) worst = t.pnl;
  }
  const dec = w + l;
  return { n: arr.length, w, l, pnl, wr: dec ? w / dec * 100 : null, pf: gl ? gw / gl : (gw ? Infinity : null), aw: w ? gw / w : null, al: l ? gl / l : null, best, worst };
}

/* ───────── chart ───────── */
function monoPath(p) {
  const n = p.length; if (n < 2) return '';
  const dx = [], m = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1].x - p[i].x; m[i] = (p[i + 1].y - p[i].y) / dx[i]; }
  const t = [m[0]];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  t[n - 1] = m[n - 2];
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(p[i].x + h).toFixed(1)},${(p[i].y + t[i] * h).toFixed(1)} ${(p[i + 1].x - h).toFixed(1)},${(p[i + 1].y - t[i + 1] * h).toFixed(1)} ${p[i + 1].x.toFixed(1)},${p[i + 1].y.toFixed(1)}`;
  }
  return d;
}
function series() {
  const m = new Map(), add = (d, v) => m.set(d, (m.get(d) || 0) + v);
  S.trades.forEach(t => add(t.trade_date, t.pnl));
  if (S.ctype === 'balance') S.cash.forEach(c => add(c.flow_date, c.kind === 'deposit' ? c.usd : -c.usd));
  const dates = [...m.keys()].sort();
  if (!dates.length) return [];
  let run = 0;
  const pts = dates.map(d => { run += m.get(d); return { d, v: run }; });
  pts.unshift({ d: addD(pts[0].d, -1), v: 0 });
  const days = +S.range;
  if (!days) return pts;
  const cut = addD(todayS(), -days);
  const i = pts.findIndex(p => p.d >= cut);
  const sl = i === -1 ? pts.slice(-2) : pts.slice(Math.max(0, i - 1));
  return sl.length < 2 ? pts.slice(-2) : sl;
}
function drawChart(anim) {
  const box = $('#chart'); if (!box) return;
  const pts = series();
  if (pts.length < 2) { box.innerHTML = '<div class="empty">Belum ada data untuk digambar. Catat top up dan trade pertamamu.</div>'; box.onpointermove = null; return; }
  const W = Math.max(240, box.clientWidth || 320), H = W < 480 ? 200 : 250, Pd = { l: 8, r: 8, t: 16, b: 24 };
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi) { lo -= 1; hi += 1; }
  const sp = hi - lo; lo -= sp * .1; hi += sp * .1;
  const n = pts.length, X = i => Pd.l + i * (W - Pd.l - Pd.r) / (n - 1), Y = v => Pd.t + (1 - (v - lo) / (hi - lo)) * (H - Pd.t - Pd.b);
  const xy = pts.map((p, i) => ({ x: X(i), y: Y(p.v) }));
  const d = monoPath(xy), base = H - Pd.b, up = vs[n - 1] >= vs[0];
  const ax = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + 'k' : v.toFixed(0);
  const grid = [0.18, 0.52, 0.86].map(k => { const v = lo + (hi - lo) * k, y = Y(v); return `<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/><text x="${Pd.l}" y="${y - 4}">${ax(v)}</text>`; }).join('');
  const zero = lo < 0 && hi > 0 ? `<line class="zl" x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}"/>` : '';
  const mid = Math.floor((n - 1) / 2);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="chart-svg ${up ? 'up' : 'dn'} ${anim ? 'draw' : ''}" role="img" aria-label="Grafik perkembangan trading">
<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
${grid}${zero}
<path class="area" d="${d}L${xy[n - 1].x.toFixed(1)},${base}L${xy[0].x.toFixed(1)},${base}Z" fill="url(#ga)"/>
<path class="ln" pathLength="1" d="${d}"/>
<g class="hov" style="opacity:0"><line class="gd" y1="${Pd.t}" y2="${base}" x1="0" x2="0"/><circle class="gc" r="4.5" cx="0" cy="0"/></g>
<circle class="ping" cx="${xy[n - 1].x}" cy="${xy[n - 1].y}" r="4"/><circle class="endc" cx="${xy[n - 1].x}" cy="${xy[n - 1].y}" r="4"/>
<text x="${Pd.l}" y="${H - 6}">${shortD(pts[0].d)}</text><text x="${X(mid)}" y="${H - 6}" text-anchor="middle">${shortD(pts[mid].d)}</text><text x="${W - Pd.r}" y="${H - 6}" text-anchor="end">${shortD(pts[n - 1].d)}</text></svg><div class="tip" hidden></div>`;
  const hov = box.querySelector('.hov'), tip = box.querySelector('.tip');
  box.onpointermove = e => {
    const r = box.getBoundingClientRect();
    let i = Math.round((e.clientX - r.left - Pd.l) / (W - Pd.l - Pd.r) * (n - 1)); i = Math.max(0, Math.min(n - 1, i));
    const p = xy[i];
    hov.style.opacity = 1;
    const gd = hov.querySelector('.gd'); gd.setAttribute('x1', p.x); gd.setAttribute('x2', p.x);
    const gc = hov.querySelector('.gc'); gc.setAttribute('cx', p.x); gc.setAttribute('cy', p.y);

    tip.style.left = Math.max(2, Math.min(W - tip.offsetWidth - 2, p.x - tip.offsetWidth / 2)) + 'px';
  };

}

function animNums(root) {
  $$('[data-to]', root).forEach(el => {
    const to = +el.dataset.to, f = el.dataset.fmt, sg = el.dataset.signed === '1';
    const fmt = v => f === 'pct' ? Math.round(v) + '%' : f === 'int' ? String(Math.round(v)) : fUSD(v, sg);
    if (reduced) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 650), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

async function loadData() {
  const [t, c] = await Promise.all([
    sb.from('trades').select('*').order('trade_date', { ascending: true }).order('created_at', { ascending: true }),
    sb.from('cashflows').select('*').order('flow_date', { ascending: true }).order('created_at', { ascending: true }),
  ]);
  if (t.error || c.error) throw (t.error || c.error);
  S.trades = t.data.map(r => ({ ...r, pnl: +r.pnl, entry: nz(r.entry), tp: nz(r.tp), sl: nz(r.sl), lot: nz(r.lot) }));
  S.cash = c.data.map(r => ({ ...r, usd: +r.usd, idr: nz(r.idr) }));
  S.last = Date.now();
}
const sortAll = () => {
  S.trades.sort((a, b) => a.trade_date.localeCompare(b.trade_date) || String(a.created_at).localeCompare(String(b.created_at)));
  S.cash.sort((a, b) => a.flow_date.localeCompare(b.flow_date) || String(a.created_at).localeCompare(String(b.created_at)));
};
async function ensureProfile() {
  let { data, error } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (error) throw error;
  if (!data) {
    const uname = (S.user.user_metadata && S.user.user_metadata.username) || ('trader' + Math.floor(1000 + Math.random() * 9000));
    const r = await sb.from('profiles').insert({ id: S.user.id, username: uname }).select().single();
    if (r.error) throw r.error; data = r.data;
  }
  let localAv = null;
  try { localAv = localStorage.getItem('auri-avatar-' + S.user.id); } catch (_) {}
  S.profile = { ...data, avatar: data.avatar || localAv || null, monthly_target: +data.monthly_target || 0 };
}

function calHTML() {
  const first = S.cal, last = mEnd(first), pad = (pd(first).getDay() + 6) % 7, weeks = Math.ceil((pad + pd(last).getDate()) / 7), start = addD(first, -pad);
  const by = {};
  for (const t of S.trades) { const o = by[t.trade_date] || (by[t.trade_date] = { pnl: 0, w: 0, l: 0, n: 0 }); o.pnl += t.pnl; o.n++; if (t.pnl > 0) o.w++; else if (t.pnl < 0) o.l++; }
  const [rf, rt] = range(S.mode, S.anchor), today = todayS(), selWk = wkStart(S.anchor);
  let h = '<div class="cal">' + ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min', 'Pekan'].map(x => `<div class="dh">${x}</div>`).join('');
  for (let w = 0; w < weeks; w++) {
    const ws = addD(start, w * 7), agg = { pnl: 0, w: 0, l: 0, n: 0 };
    for (let k = 0; k < 7; k++) {
      const d = addD(ws, k), o = by[d], out = d < first || d > last;
      if (o) { agg.pnl += o.pnl; agg.w += o.w; agg.l += o.l; agg.n += o.n; }
      const c = o ? (o.pnl > 0 ? 'win' : o.pnl < 0 ? 'loss' : 'be') : '';
      const sel = d >= rf && d <= rt && !(S.mode === 'month' && out);
      h += `<button class="day ${c} ${out ? 'out' : ''} ${d === today ? 'today' : ''} ${sel ? 'insel' : ''} ${S.mode === 'day' && d === S.anchor ? 'pick' : ''}" data-act="pickday" data-d="${d}" aria-label="${d}"><i>${pd(d).getDate()}</i>${o ? `<em>${cmp(o.pnl)}</em>` : ''}</button>`;
    }
    const dec = agg.w + agg.l;
    h += `<button class="wk ${agg.n ? (agg.pnl >= 0 ? 'win' : 'loss') : ''} ${S.mode === 'week' && ws === selWk ? 'insel' : ''}" data-act="pickweek" data-d="${ws}" aria-label="Pekan ${ws}">${agg.n ? `<em>${cmp(agg.pnl)}</em><small>${dec ? Math.round(agg.w / dec * 100) + '%' : '–'}</small>` : '<small>–</small>'}</button>`;
  }
  return h + '</div>';
}

function updateRR() {
  const f = $('#f-trade'), el = $('#rr'); if (!f || !el) return;
  const g = n => num(f.elements[n].value), side = f.elements.side.value;
  const e = g('entry'), tp = g('tp'), sl = g('sl');
  el.className = 'rr';
  if (e == null || tp == null || sl == null) { el.textContent = 'Risk : Reward akan dihitung otomatis'; return; }
  const reward = side === 'buy' ? tp - e : e - tp, risk = side === 'buy' ? e - sl : sl - e;
  if (risk > 0 && reward > 0) { el.textContent = `Risk : Reward  1 : ${(reward / risk).toFixed(2)}`; el.classList.add('good'); }
  else { el.textContent = 'TP dan SL tidak searah dengan arah trade'; el.classList.add('warn'); }
}
function cashModal(kind, id) {
  const c = id ? S.cash.find(x => x.id === id) : null;
  kind = c ? c.kind : kind;
  const wd = kind === 'withdraw';
  modal(`${c ? 'Edit ' : ''}${wd ? 'Withdraw' : 'Top up'}`, `<form id="f-cash" novalidate data-id="${c ? c.id : ''}"><input type="hidden" name="kind" value="${kind}">
   <label class="fld"><span>Tanggal</span><input type="date" name="date" value="${c ? c.flow_date : todayS()}" required></label>
   <label class="fld"><span>Jumlah (USD)</span><input name="usd" inputmode="decimal" placeholder="0.00" value="${c ? c.usd : ''}"></label>
   ${wd ? `<label class="fld"><span>Jumlah diterima (Rupiah, opsional)</span><input name="idr" inputmode="numeric" placeholder="0" value="${c && c.idr ? Math.round(c.idr) : ''}"></label><div class="rr" id="rate"></div>` : ''}
   <label class="fld"><span>Catatan (opsional)</span><input name="note" maxlength="120" value="${esc(c ? c.note : '')}"></label>
   <div class="err-t" id="ferr"></div>
   <div class="form-act ${c ? 'two' : ''}"><button class="btn" type="submit">Simpan</button>${c ? `<button class="btn danger" type="button" data-act="del" data-kind="cash" data-id="${c.id}">Hapus</button>` : ''}</div></form>`);
  updateRate();
}
function updateRate() {
  const f = $('#f-cash'), el = $('#rate'); if (!f || !el) return;
  const u = num(f.elements.usd.value), r = num(f.elements.idr.value);
  el.textContent = u > 0 && r > 0 ? `Kurs sekitar ${fIDR(r / u)} per USD` : '';
}

const A = {

  authview: b => renderAuth(b.dataset.v),
  nav: b => go(b.dataset.p),
  mode: b => { S.mode = b.dataset.v; S.cal = mStart(S.anchor); render(false); },
  prev: () => shift(-1), next: () => shift(1),
  today: () => { S.anchor = todayS(); S.cal = mStart(S.anchor); render(false); },
  calprev: () => { S.cal = addM(S.cal, -1); render(false); },
  calnext: () => { S.cal = addM(S.cal, 1); render(false); },

  ctype: b => { S.ctype = b.dataset.v; render(false); drawChart(true); },
  range: b => { S.range = b.dataset.v; render(false); drawChart(true); },
  'add-trade': () => tradeModal(),
  'edit-trade': b => tradeModal(b.dataset.id),
  'add-cash': b => cashModal(b.dataset.k),
  'edit-cash': b => cashModal(null, b.dataset.id),
  close: closeModal,
  'avatar-pick': (b, e) => {
    const input = $('#avatar-in');
    if (input && (!e || e.target !== input)) input.click();
  },
  'avatar-del': async () => {
    if (!S.profile) return;
    S.profile.avatar = null;
    try { localStorage.removeItem('auri-avatar-' + (S.user ? S.user.id : 'local')); } catch (_) {}
    render(false);
    updateAvatars();
    if (sb && S.user) {
      await sb.from('profiles').update({ avatar: null }).eq('id', S.user.id).catch(() => {});
    }
    toast('Foto profil dihapus');
  },
  'export-trades': () => dl('auri-trades.csv', csv([['tanggal', 'arah', 'entry', 'tp', 'sl', 'lot', 'sesi', 'pnl_usd', 'catatan'], ...S.trades.map(t => [t.trade_date, t.side, t.entry, t.tp, t.sl, t.lot, t.session, t.pnl, t.note])])),
  'export-cash': () => dl('auri-kas.csv', csv([['tanggal', 'jenis', 'usd', 'idr', 'catatan'], ...S.cash.map(c => [c.flow_date, c.kind, c.usd, c.idr, c.note])])),
  logout: async () => { await sb.auth.signOut(); },
  del: async b => {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Yakin hapus?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Hapus'; } }, 2500); return; }
    const kind = b.dataset.kind, id = b.dataset.id, tb = kind === 'trade' ? 'trades' : 'cashflows';
    b.disabled = true;
    const { error } = await sb.from(tb).delete().eq('id', id);
    if (error) { b.disabled = false; return $('#ferr').textContent = tErr(error); }
    if (kind === 'trade') S.trades = S.trades.filter(x => x.id !== id); else S.cash = S.cash.filter(x => x.id !== id);
    closeModal(); render(false); toast('Dihapus');
  },
};
function shift(dir) {
  const a = S.anchor;
  S.anchor = S.mode === 'day' ? addD(a, dir) : S.mode === 'week' ? addD(a, 7 * dir) : addM(a, dir);
  S.cal = mStart(S.anchor); render(false);
}
function updateAvatars() {
  const avHtml = avatar('sm');
  $$('.side-f .av, .ph-r button[data-p=settings] .av').forEach(el => {
    el.outerHTML = avHtml;
  });
}
document.addEventListener('click', e => {
  const sg = e.target.closest('.seg[data-seg] button');
  if (sg) {
    const box = sg.closest('.seg'); $$('button', box).forEach(x => x.classList.toggle('on', x === sg));
    $('input', box).value = sg.dataset.v; if (box.closest('#f-trade')) updateRR(); return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = A[b.dataset.act]; if (fn) fn(b, e);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('cam')) {
    e.preventDefault();

    if (input) input.click();

document.addEventListener('input', e => {
  if (e.target.closest('#f-trade')) updateRR();

});
document.addEventListener('change', async e => {
  if (e.target.id !== 'avatar-in' || !e.target.files || !e.target.files[0]) return;
  const inputEl = e.target;
  const file = inputEl.files[0];
  try {
    toast('Memproses foto…');
    const url = await cropImg(file);
    if (!S.profile) S.profile = {};
    S.profile.avatar = url;
    try {
      localStorage.setItem('auri-avatar-' + (S.user ? S.user.id : 'local'), url);
    } catch (_) {}
    render(false);
    updateAvatars();
    if (sb && S.user) {
      const { error } = await sb.from('profiles').update({ avatar: url }).eq('id', S.user.id);
      if (error) {
        console.warn('Gagal sinkron ke database:', error);
        toast('Foto disimpan lokal (database belum sinkron)');
        return;
      }
    }
    toast('Foto profil berhasil diperbarui');
  } catch (err) {
    console.error('Avatar upload error:', err);
    toast(tErr(err));
  } finally {
    try { inputEl.value = ''; } catch (_) {}
  }
});
function cropImg(file) {
  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error('Tidak ada file dipilih'));
    if (file.type && !file.type.startsWith('image/')) {
      return reject(new Error('Pilih file gambar (JPG, PNG, WebP)'));
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file gambar'));
    reader.onload = ev => {
      const img = new Image();
      img.onerror = () => reject(new Error('Gambar tidak bisa dibaca atau format tidak didukung'));
      img.onload = () => {
        try {
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          if (!w || !h) return reject(new Error('Dimensi gambar tidak valid'));
          const s = Math.min(w, h);
          const c = document.createElement('canvas');
          c.width = 256;
          c.height = 256;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, 256, 256);
          const sx = (w - s) / 2;
          const sy = (h - s) / 2;
          ctx.drawImage(img, sx, sy, s, s, 0, 0, 256, 256);
          const dataUrl = c.toDataURL('image/jpeg', 0.88);
          resolve(dataUrl);
        } catch (err) {
          reject(err);
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
const csv = rows => rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
function dl(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ───────── event: submit ───────── */
const F = {
  'f-in': async f => {
    const email = f.elements.email.value.trim(), pw = f.elements.pw.value;
    if (!email || !pw) return renderAuthMsg('in', 'Isi email dan password.');
    busy(f, true);
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { busy(f, false); renderAuthMsg('in', tErr(error)); }
  },
  'f-up': async f => {
    const username = f.elements.username.value.trim(), email = f.elements.email.value.trim(), pw = f.elements.pw.value;
    if (username.length < 2) return renderAuthMsg('up', 'Username minimal 2 karakter.');
    if (!/^[\w.\- ]+$/.test(username)) return renderAuthMsg('up', 'Username hanya huruf, angka, spasi, titik, garis.');
    if (!email) return renderAuthMsg('up', 'Isi email.');
    if (pw.length < 6) return renderAuthMsg('up', 'Password minimal 6 karakter.');
    busy(f, true);
    const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { username }, emailRedirectTo: location.origin + location.pathname } });
    busy(f, false);
    if (error) return renderAuthMsg('up', tErr(error));
    if (data.user && data.user.identities && data.user.identities.length === 0) return renderAuthMsg('up', 'Email sudah terdaftar. Coba masuk.');
    if (!data.session) renderAuth('in', { t: 'ok', m: 'Akun dibuat. Cek email untuk konfirmasi, lalu masuk.' });
  },
  'f-forgot': async f => {
    const email = f.elements.email.value.trim();
    if (!email) return renderAuthMsg('forgot', 'Isi email.');
    busy(f, true);
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    busy(f, false);
    if (error) return renderAuthMsg('forgot', tErr(error));
    renderAuth('forgot', { t: 'ok', m: 'Link reset dikirim. Cek inbox dan folder spam.' });
  },
  'f-recover': async f => {
    const pw = f.elements.pw.value;
    if (pw.length < 6) return renderAuthMsg('recover', 'Password minimal 6 karakter.');
    busy(f, true);
    const { data, error } = await sb.auth.updateUser({ password: pw });
    busy(f, false);
    if (error) return renderAuthMsg('recover', tErr(error));
    S.recovering = false; history.replaceState(null, '', location.pathname);
    boot(data.user);
  },
  'f-name': async f => {
    const u = f.elements.username.value.trim();
    if (u.length < 2 || u.length > 24) return toast('Username 2 sampai 24 karakter.');
    busy(f, true);
    const { error } = await sb.from('profiles').update({ username: u }).eq('id', S.user.id);
    busy(f, false);
    if (error) return toast(tErr(error));
    S.profile.username = u; render(false); toast('Username disimpan');
  },
  'f-target': async f => {
    const raw = f.elements.target.value.trim(), v = raw ? num(raw) : 0;
    if (v == null || v < 0) return toast('Target harus angka positif.');
    busy(f, true);
    const { error } = await sb.from('profiles').update({ monthly_target: v }).eq('id', S.user.id);
    busy(f, false);
    if (error) return toast(tErr(error));
    S.profile.monthly_target = v; toast(v ? 'Target disimpan' : 'Target dimatikan');
  },
  'f-pass': async f => {
    const pw = f.elements.pw.value;
    if (pw.length < 6) return toast('Password minimal 6 karakter.');
    busy(f, true);
    const { error } = await sb.auth.updateUser({ password: pw });
    busy(f, false);
    if (error) return toast(tErr(error));
    f.reset(); toast('Password diperbarui');
  },
  'f-trade': async f => {
    const g = n => f.elements[n].value.trim(), err = m => { $('#ferr').textContent = m; };
    const date = g('date'), entry = num(g('entry')), tp = g('tp') ? num(g('tp')) : null, sl = g('sl') ? num(g('sl')) : null, lot = g('lot') ? num(g('lot')) : null, amt = num(g('amt'));
    if (!date) return err('Tanggal wajib diisi.');
    if (entry == null || entry <= 0) return err('Entry harus berupa angka.');
    if (g('tp') && tp == null) return err('Take profit harus berupa angka.');
    if (g('sl') && sl == null) return err('Stop loss harus berupa angka.');
    if (g('lot') && (lot == null || lot <= 0)) return err('Lot harus berupa angka positif.');
    if (amt == null || amt < 0) return err('Isi hasil dalam USD. Kalau impas, isi 0.');
    const row = { user_id: S.user.id, trade_date: date, side: g('side'), entry, tp, sl, lot, pnl: (g('res') === 'loss' ? -amt : amt) || 0, session: g('session') || null, note: g('note') || null };
    busy(f, true);
    const id = f.dataset.id;
    const r = id ? await sb.from('trades').update(row).eq('id', id).select().single() : await sb.from('trades').insert(row).select().single();
    busy(f, false);
    if (r.error) return err(tErr(r.error));
    const nr = { ...r.data, pnl: +r.data.pnl, entry: nz(r.data.entry), tp: nz(r.data.tp), sl: nz(r.data.sl), lot: nz(r.data.lot) };
    if (id) S.trades = S.trades.map(x => x.id === id ? nr : x); else S.trades.push(nr);
    sortAll(); closeModal(); render(false); toast(id ? 'Trade diperbarui' : 'Trade disimpan');
  },
  'f-cash': async f => {
    const g = n => f.elements[n] ? f.elements[n].value.trim() : '', err = m => { $('#ferr').textContent = m; };
    const kind = g('kind'), date = g('date'), usd = num(g('usd')), idr = g('idr') ? num(g('idr')) : null;
    if (!date) return err('Tanggal wajib diisi.');
    if (usd == null || usd <= 0) return err('Jumlah USD harus lebih dari 0.');
    if (g('idr') && (idr == null || idr < 0)) return err('Jumlah Rupiah harus berupa angka.');
    const row = { user_id: S.user.id, flow_date: date, kind, usd, idr: kind === 'withdraw' ? idr : null, note: g('note') || null };
    busy(f, true);
    const id = f.dataset.id;
    const r = id ? await sb.from('cashflows').update(row).eq('id', id).select().single() : await sb.from('cashflows').insert(row).select().single();
    busy(f, false);
    if (r.error) return err(tErr(r.error));
    const nr = { ...r.data, usd: +r.data.usd, idr: nz(r.data.idr) };
    if (id) S.cash = S.cash.map(x => x.id === id ? nr : x); else S.cash.push(nr);
    sortAll(); closeModal(); render(false); toast(id ? 'Diperbarui' : kind === 'deposit' ? 'Top up dicatat' : 'Withdraw dicatat');
  },
};
function renderAuthMsg(view, m) {
  const card = $('.auth-card'); if (!card) return;
  let box = $('.msg', card);
  if (!box) { box = document.createElement('div'); box.className = 'msg err'; const f = $('form', card); f.parentNode.insertBefore(box, f); }
  box.className = 'msg err'; box.textContent = m;
}
document.addEventListener('submit', e => {
  e.preventDefault();
  const fn = F[e.target.id]; if (fn) fn(e.target).catch(err => { console.error(err); busy(e.target, false); toast(tErr(err)); });
});

/* ───────── boot & sesi ───────── */
async function boot(user) {
  S.user = user;
  try { await ensureProfile(); await loadData(); }
  catch (e) {
    console.error(e); S.user = null;
    await sb.auth.signOut().catch(() => {});
    return renderAuth('in', { t: 'err', m: tErr(e) });
  }
  showApp();
}
function hideSplash() { const s = $('#splash'); s.classList.add('out'); setTimeout(() => s.hidden = true, 500); }

async function init() {
  setTheme(document.documentElement.dataset.theme);
  const ok = /^https?:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith('ISI_') && window.supabase;
  if (!ok) { await sleep(1700); hideSplash(); renderAuth('in'); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  if (/type=recovery/.test(location.hash)) S.recovering = true;
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { S.recovering = true; if (S.ready) renderAuth('recover'); return; }
    if (ev === 'SIGNED_OUT') { if (S.ready) { S.user = null; S.profile = null; S.trades = []; S.cash = []; renderAuth('in'); } return; }
    if (ev === 'SIGNED_IN' && S.ready && !S.recovering && session) {
      if (S.user && S.user.id === session.user.id) return;
      setTimeout(() => boot(session.user), 0);
    }
  });
  let session = null;
  try { const [r] = await Promise.all([sb.auth.getSession(), sleep(1700)]); session = r.data.session; } catch (e) { await sleep(300); }
  hideSplash();
  S.ready = true;
  if (S.recovering) return renderAuth('recover');
  if (session) await boot(session.user); else renderAuth('in');
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.user || !S.ready || Date.now() - S.last < 15000) return;
  try { await loadData(); if (!['settings', 'econ'].includes(S.page) && $('#modal').hidden) render(false); } catch (e) { /* diam, coba lagi nanti */ }
});
init();
